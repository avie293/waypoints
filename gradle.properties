# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Mod
# Fabric allows "-" in mod ids, NeoForge only "_". Assets and translations keep using mod_id.
mod_id=avies-waypoints
neoforge_mod_id=avies_waypoints
mod_name=Avies Waypoints
mod_description=Set waypoints in your world and find your way back to them.
mod_version=2.0.0
mod_group=cc.avie.waypoints
mod_author=Avie
mod_homepage=https://avie.cc/
mod_sources=https://github.com/avie293/waypoints/
mod_issues=https://github.com/avie293/avie-issues/issues
mod_license=Avie Terms & Conditions 1.0
java_version=25

# Minecraft
minecraft_version=26.3
minecraft_version_range=[26.3,26.4)

# Fabric - https://fabricmc.net/develop/
fabric_loader_version=0.20.1
fabric_api_version=0.166.2+26.3
loom_version=1.19.4

# NeoForge - https://projects.neoforged.net/neoforged/neoforge
neoforge_version=26.3.0.103
# https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1
# https://projects.neoforged.net/neoforged/ModDevGradle
moddev_version=2.0.148

# Dependencies
tabbylib_version=2.0.1
# Only for the mixin annotations in common
mixin_version=0.17.5+mixin.0.8.7
mixinextras_version=0.5.5
